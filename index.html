["Exam-style [6 marks] / Try 1-3 / Exercise 2-2: Explain why HTTPS uses public-key cryptography to share the key but common-key cryptography to exchange the data. (security and speed)|سؤال بنمط الامتحان [6 درجات] / جرّب 1-3 / تمرين 2-2: اشرح لماذا يستخدم HTTPS تشفير المفتاح العام لمشاركة المفتاح، لكن تشفير المفتاح المشترك لتبادل البيانات. (الأمان والسرعة)",
"Public-key cryptography lets the browser and server share a common key safely, because the public key can be sent openly and only the private key can unlock it (security). But it is slow for large amounts of data. Common-key cryptography is much faster, so it is used to exchange the data once the key is shared (speed). Combining both gives security and speed.|يتيح تشفير المفتاح العام للمتصفح والخادم مشاركة المفتاح المشترك بأمان، لأن المفتاح العام يمكن إرساله علناً ولا يفكه إلا المفتاح الخاص (الأمان). لكنه بطيء مع البيانات الكبيرة. أما تشفير المفتاح المشترك فأسرع بكثير، لذلك يُستخدم لتبادل البيانات بعد مشاركة المفتاح (السرعة). والجمع بينهما يحقق الأمان والسرعة."],

let ac;function snd(f,d=.15,t="sine"){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

 const show=()=>{if(i>=list.length)return done(sc,list.length);const q=list[i];
  box.innerHTML=`<div class="pb"><div style="width:${i/list.length*100}%"></div></div><div class="q">${i+1}/${list.length} — ${T(q.t)}</div>`+q.o.map((o,k)=>`<button class="o" data-k="${k}">${T(o)}</button>`).join("");
  box.querySelectorAll(".o").forEach(b=>b.onclick=ev=>{const k=+b.dataset.k;box.querySelectorAll(".o").forEach(x=>x.disabled=true);
   box.querySelectorAll(".o")[q.c].classList.add("ok");
   if(k==q.c){sc++;good();fx("😄🎉",ev.clientX,ev.clientY)}else{b.classList.add("no");bad();fx("😢❌",ev.clientX,ev.clientY)}
   const n=document.createElement("button");n.className="btn";n.style.marginTop="8px";n.innerHTML="Next ➜ التالي";n.onclick=()=>{i++;show()};box.appendChild(n)});};
 show()}
